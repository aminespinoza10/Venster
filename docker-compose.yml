services:
  # Servicio de la API (Backend en Go)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: venster-api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    networks:
      - venster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio Web (Frontend en React)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: venster-web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - venster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  venster-network:
    driver: bridge
